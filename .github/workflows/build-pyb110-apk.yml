name: Build OnePlus 16 ColorOS debug APK

on:
  push:
    branches: [port/coloros17-pyb110-apk]

permissions:
  actions: read
  contents: read
  packages: read

env:
  PYB110_BUILD_RUN: "44926279431"
  PYB110_IMAGE_RUN: "44932670737"

jobs:
  publish-payloads:
    if: github.repository == 'DeathThoughts/OneOS-test' && github.ref == 'refs/heads/port/coloros17-pyb110-apk'
    permissions:
      actions: read
      contents: write
    concurrency:
      group: pyb110-payloads-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify the source image run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PYB110_BUILD_RUN" |
            jq -e '
              .status == "completed" and .conclusion == "success" and
              .head_sha == "8f43e862df23d199fdca8586d33c676c811eb406" and
              .head_branch == "port/coloros17-pyb110" and .name == "Build OnePlus 16 ColorOS guest"
            '

      - uses: actions/download-artifact@v4
        with:
          name: pyb110-overlays
          github-token: ${{ github.token }}
          run-id: ${{ env.PYB110_BUILD_RUN }}
          path: out/pyb110-download

      - name: Verify and publish server-side overlays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd out/pyb110-download && sha256sum --strict --check SHA256SUMS)
          python3 scripts/publish-pyb110-payloads.py out/pyb110-download

  verify-image:
    if: github.repository == 'DeathThoughts/OneOS-test' && github.ref == 'refs/heads/port/coloros17-pyb110-apk'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the prepared ZIP artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PYB110_IMAGE_RUN" | jq -e '
            .status == "completed" and .conclusion == "success" and
            .head_sha == "1eac93f83406f6fdbe9ebc2af0f2dbca3df7c276"
          '
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14718423839" | jq -e '
            .workflow_run.id == ($ENV.PYB110_IMAGE_RUN | tonumber) and
            .name == "pyb110-system-img-untested" and .expired == false and
            .size_in_bytes == 7508245938 and .digest == "sha256:14eafb346a6a97ad94fc840d5e319af87aace20956f30eeb40aaa3aac9306c59"
          '

      - name: Read the exact download with Java's ZIP reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14718423839/zip" > image.zip
          printf '%s  %s\n' 14eafb346a6a97ad94fc840d5e319af87aace20956f30eeb40aaa3aac9306c59 image.zip | sha256sum --strict -c
          cat > VerifyImage.java <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.util.*;
          import java.util.zip.*;

          class VerifyImage {
              public static void main(String[] args) throws Exception {
                  var digest = MessageDigest.getInstance("SHA-256");
                  try (var zip = new ZipInputStream(Files.newInputStream(Path.of(args[0])))) {
                      var entry = zip.getNextEntry();
                      if (entry == null || entry.isDirectory() || !entry.getName().equals("system.img")) {
                          throw new IllegalStateException("Expected system.img as the first entry");
                      }
                      long size = new DigestInputStream(zip, digest).transferTo(java.io.OutputStream.nullOutputStream());
                      String hash = HexFormat.of().formatHex(digest.digest());
                      if (zip.getNextEntry() != null || size != 13810913280L ||
                          !hash.equals("1b7057a78c6a0f834e5020832c3ef2f82cafba5570d62559e9cb2d6761d86f4c")) {
                          throw new IllegalStateException("ZIP contents differ from the verified image");
                      }
                      System.out.printf("Verified only system.img, %d bytes, SHA-256 %s%n", size, hash);
                  }
              }
          }
          JAVA
          java VerifyImage.java image.zip

  build:
    needs: publish-payloads
    permissions:
      contents: read
      packages: read
    if: github.repository == 'DeathThoughts/OneOS-test' && github.ref == 'refs/heads/port/coloros17-pyb110-apk'
    environment: debug-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already carries an Android SDK (ANDROID_HOME) with
      # cmdline-tools. android-actions/setup-android@v3 is not used: it always
      # runs `sdkmanager tools`, which the runner's cmdline-tools 16.0 no
      # longer knows ("Failed to find package 'tools'", run 43715769344).
      # compileSdk 37, and the build-tools AGP 9.4.1 defaults to.
      - name: Install Android SDK packages
        run: |
          set -eu
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:?no Android SDK on the runner}}
          sdkmanager=$sdk/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi
          [ -x "$sdkmanager" ] || { echo "no sdkmanager under $sdk/cmdline-tools" >&2; exit 1; }
          echo "Using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -eu
          if [ -z "${DEBUG_KEYSTORE_B64:-}" ]; then
            msg="DEBUG_KEYSTORE_B64 not set: this APK is signed with a one-off key and cannot be installed over an earlier build"
            echo "::warning::$msg"
            echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ks=$RUNNER_TEMP/oneos-debug.keystore
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$ks"
          chmod 600 "$ks"
          mkdir -p "$HOME/.android"
          cp "$ks" "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          fp=$(keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey | grep 'SHA256:' | head -n 1 | sed 's/^[[:space:]]*SHA256:[[:space:]]*//')
          [ -n "$fp" ] || { echo "no SHA256 fingerprint for androiddebugkey in $ks" >&2; exit 1; }
          echo "Debug keystore: SHA256: $fp"
          echo "Debug keystore certificate: \`$fp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "ONEOS_DEBUG_KEYSTORE=$ks" >> "$GITHUB_ENV"
          # Lowercase hex without colons, as apksigner prints it; checked against
          # the APK's signer after the build.
          echo "ONEOS_DEBUG_KEYSTORE_SHA256=$(printf '%s' "$fp" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5

      - name: Configure debug patch public pin
        env:
          ONEOS_PATCH_DEBUG_PUBLIC_KEY: ${{ vars.ONEOS_PATCH_DEBUG_PUBLIC_KEY }}
        run: |
          set -eu
          if [ -n "${ONEOS_PATCH_DEBUG_PUBLIC_KEY:-}" ]; then
            # BuildConfig only accepts this DER public-key encoding. Do not let
            # an unexpected newline in a repository variable write extra settings.
            printf '%s' "$ONEOS_PATCH_DEBUG_PUBLIC_KEY" | grep -qE '^[A-Za-z0-9+/]{59}=$'
            [ "${#ONEOS_PATCH_DEBUG_PUBLIC_KEY}" = 60 ]
            printf 'ONEOS_PATCH_DEBUG_PUBLIC_KEY=%s\n' "$ONEOS_PATCH_DEBUG_PUBLIC_KEY" >> "$GITHUB_ENV"
          else
            echo "Signed patch feed disabled in this build: no debug patch key." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build guest manager
        env:
          ONEOS_PATCH_RELEASE_PUBLIC_KEY: ${{ vars.ONEOS_PATCH_RELEASE_PUBLIC_KEY }}
          GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: sh scripts/build-guest-manager.sh debug

      - name: Test OnePlus 16 staging and build host APK
        working-directory: app-android
        env:
          GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew --console=plain :core:model:test \
            --tests '*ApkSeriesTest' --tests '*ImagesTest' --tests '*PackageSetsTest' --tests '*ProfilesTest' \
            --tests '*SingleImageZipInputStreamTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest \
                    --tests '*StageScriptTest.pyb110StagesAndPassesLaunchChecksOnlyOnTheBaseGalaxyS23' \
            --tests '*StageScriptTest.galaxyS26FeStagesAndroid17ImagesOnly'
          ./gradlew --console=plain :app:assembleFullDebug

      - name: Verify OnePlus 16 download metadata and root staging registry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile

          manifest = Path("app-android/packages/pyb110-s23.sha256").read_text()
          pyb110 = {
              name: digest for digest, name in
              (line.split() for line in manifest.splitlines() if line and not line.startswith("#"))
          }
          wanted = set(pyb110.values())
          assert len(pyb110) == len(wanted) and len(wanted) > 20, "Invalid OnePlus 16 overlay manifest"
          packages = Path("app-android/packages")

          def read_index(text):
              return dict(line.split() for line in text.splitlines() if line and not line.startswith("#"))

          expected_sizes = read_index((packages / "sizes.txt").read_text())
          expected_remote = read_index((packages / "remote.txt").read_text())
          expected_root = Path("app-android/app/src/full/assets/root/oneos_root.sh").read_bytes()
          raw_pin = b'13810913280 1b7057a78c6a0f834e5020832c3ef2f82cafba5570d62559e9cb2d6761d86f4c'
          assert b'coloros17-pyb110) echo "' + raw_pin + b'"' in expected_root
          for profile in ("s-8550",):
              assert f'"{profile} coloros17-pyb110") echo pyb110-s23 ;;'.encode() in expected_root, (
                  f"OnePlus 16 root registry entry is missing for {profile}"
              )
          asset_base = "assets/oneos/"
          files = asset_base + "files/"
          with zipfile.ZipFile("app-android/app/build/outputs/apk/full/debug/app-full-debug.apk") as apk:
              assert apk.read("assets/root/oneos_root.sh") == expected_root, "APK root registry differs from source"
              entries = set(apk.namelist())
              manifest_asset = asset_base + "sets/pyb110-s23.sha256"
              embedded_manifest = {
                  name: digest for digest, name in
                  (line.split() for line in apk.read(manifest_asset).decode().splitlines())
              }
              assert embedded_manifest == pyb110, "APK OnePlus 16 manifest differs from its pins"
              sizes = read_index(apk.read(files + "index.txt").decode())
              remote = read_index(apk.read(files + "remote.txt").decode())
              for name, digest in pyb110.items():
                  assert sizes.get(digest) == expected_sizes[digest], f"Missing or incorrect size: {name}"
                  assert remote.get(digest) == expected_remote[digest], f"Missing or incorrect source: {name}"
                  assert files + digest not in entries, f"APK embeds OnePlus 16 overlay: {name}"
              scripts = {
                  name: digest for digest, name in
                  (line.split() for line in apk.read(asset_base + "sets/scripts.sha256").decode().splitlines())
              }
              staged_guest = Path("switcher/assets/guest_manager.apk")
              with staged_guest.open("rb") as guest:
                  assert hashlib.file_digest(guest, "sha256").hexdigest() == scripts[staged_guest.name], (
                      "APK does not carry the staged debug guest manager"
                  )
              other = set()
              for path in sorted(entries):
                  if not path.startswith(asset_base + "sets/") or path in {
                      manifest_asset, asset_base + "sets/scripts.sha256",
                  }:
                      continue
                  other.update(line.split()[0] for line in apk.read(path).decode().splitlines())
              assert other, "APK is missing remote package sets"
              exclusive = other - wanted - set(scripts.values())
              assert exclusive <= remote.keys(), "Other set files are missing remote sources"
              assert all(files + digest not in entries for digest in exclusive), (
                  "APK embeds payloads exclusive to other package sets"
              )
          PY

      - name: Verify signatures and prepare OnePlus 16 APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          name=OneOS-0.5.32-OnePlus16-S23-rebuilt-debug.apk
          apk=dist/$name
          cp app-android/app/build/outputs/apk/full/debug/app-full-debug.apk "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")
          package_info=$(printf '%s\n' "$badging" | sed -n '/^package:/p')
          grep -Fq "versionName='0.5.32'" <<< "$package_info"
          grep -Fq "versionCode='181'" <<< "$package_info"
          host_certs=$("$apksigner" verify --print-certs "$apk")
          guest_certs=$("$apksigner" verify --print-certs switcher/assets/guest_manager.apk)
          signer=$(printf '%s\n' "$host_certs" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          guest_signer=$(printf '%s\n' "$guest_certs" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          [[ "$signer" =~ ^[0-9a-f]{64}$ && "$guest_signer" == "$signer" ]] ||
            { echo "Host APK and guest manager must have the same signer" >&2; exit 1; }
          if [ -n "${ONEOS_DEBUG_KEYSTORE_SHA256:-}" ] && [ "$signer" != "$ONEOS_DEBUG_KEYSTORE_SHA256" ]; then
            echo "APK signer differs from the configured debug key" >&2
            exit 1
          fi
          (cd dist && sha256sum "$name" > "$name.sha256")
          {
            echo "APK SHA-256 $(cut -d' ' -f1 "$apk.sha256")"
            echo "Host signer SHA-256 $signer"
            echo "Guest manager signer SHA-256 $guest_signer"
            echo "Source OnePlus 16 build $PYB110_BUILD_RUN"
          } | tee dist/signing.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: oneos-pyb110-s23-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
