name: Auto upstream sync

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - '.github/workflows/auto-upstream.yml'
      - 'scripts/sync-upstream-catalog.py'

permissions:
  contents: read

concurrency:
  group: oneos-auto-upstream
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'DeathThoughts/OneOS-test' && (github.ref_name == 'release' || github.ref_name == 'debug')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      candidate: ${{ steps.sync.outputs.candidate }}
      pr: ${{ steps.sync.outputs.pr }}
      base: ${{ steps.sync.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare and prepare an integration PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: DeathThoughts/OneOS-test
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          git config core.hooksPath /dev/null
          git config user.name 'OneOS upstream sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp scripts/sync-upstream-catalog.py "$RUNNER_TEMP/sync-upstream-catalog.py"
          git fetch --no-tags origin refs/heads/debug:refs/remotes/origin/debug
          git fetch --no-tags https://github.com/fahadalijaved/OneOS.git refs/heads/main
          base=$(git rev-parse refs/remotes/origin/debug)
          upstream=$(git rev-parse FETCH_HEAD)
          echo "Debug: $base | upstream: $upstream" >> "$GITHUB_STEP_SUMMARY"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo "Debug already contains upstream." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Re-audit raw drafts every run; preserve any manual resolution.
          open=$(gh pr list --state open --base debug --limit 100 \
            --json number,headRefName,headRefOid,isDraft \
            --jq '[.[] | select(.headRefName | startswith("sync/upstream-"))] | first // empty')
          gh auth setup-git
          existing_pr=""
          existing_head=""
          raw_draft=false
          branch="sync/upstream-${upstream:0:12}"
          if [[ -n "$open" ]]; then
            number=$(jq -r .number <<< "$open")
            branch=$(jq -r .headRefName <<< "$open")
            old=$(jq -r .headRefOid <<< "$open")
            git fetch --no-tags origin "refs/heads/$branch"
            if [[ $(jq -r .isDraft <<< "$open") == true ]] &&
               git merge-base --is-ancestor "$old" "$upstream"; then
              existing_pr="$number"
              existing_head="$old"
              raw_draft=true
            elif [[ $(jq -r .isDraft <<< "$open") == false ]]; then
              existing_pr="$number"
              existing_head="$old"
            else
              echo "Existing integration PR #$number has manual work; retained." >> "$GITHUB_STEP_SUMMARY"
              echo "pr=$number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git checkout --detach "$base"
          git merge --no-ff --no-commit "$upstream" || true
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Merge could not be prepared." >&2
            exit 1
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          other=$(printf '%s\n' "$conflicts" | grep -v -E '^(app-android/packages/(remote|sizes)\.txt)?$' || true)
          echo "Conflicting paths (before catalog reconciliation):"
          printf '%s\n' "$conflicts"
          if [[ -n "$other" ]]; then
            git diff --cc --stat
            git diff --cc --no-color | head -c 160000 || true
          fi
          # Only the two hash-keyed metadata tables can be reconciled automatically.
          # Never choose ours/theirs wholesale for executable code, pins or guards.
          reason=""
          if [[ -z "$other" ]]; then
            if ! python3 "$RUNNER_TEMP/sync-upstream-catalog.py" "$base" "$upstream"; then
              reason="Patch catalog reconciliation failed; manual review required."
            fi
          else
            reason="Overlapping code or manifest changes require manual review."
          fi
          if [[ -z "$reason" && -z "$(git diff --name-only --diff-filter=U)" ]]; then
            git diff --cached --check
            git commit -m "Merge upstream OneOS ${upstream:0:12} into fork integration"
            candidate=$(git rev-parse HEAD)
            draft=()
            title="Sync upstream OneOS ${upstream:0:12} (clean candidate)"
          else
            git merge --abort
            candidate="$upstream"
            draft=(--draft)
            title="Sync upstream OneOS ${upstream:0:12} (manual conflict review)"
            {
              echo "$reason"
              echo ""
              echo "Conflicting paths:"
              printf '%s\n' "$conflicts"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$existing_pr" ]]; then
            echo "pr=$existing_pr" >> "$GITHUB_OUTPUT"
            if [[ "$raw_draft" == true ]]; then
              if [[ -n "$reason" ]]; then
                if [[ "$existing_head" != "$upstream" ]]; then
                  git push origin "$upstream:refs/heads/$branch"
                fi
                echo "PR #$existing_pr still requires manual resolution." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              git push origin "$candidate:refs/heads/$branch"
              gh pr ready "$existing_pr"
              echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -n "$reason" ]] ||
               [[ "$(git show -s --format=%P "$existing_head")" != "$base $upstream" ]] ||
               [[ "$(git rev-parse "$existing_head^{tree}")" != "$(git rev-parse "$candidate^{tree}")" ]]; then
              echo "PR #$existing_pr no longer matches a reproducible integration; manual review." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "candidate=$existing_head" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A normal non-forced push is deliberate. Existing branches are not replaced.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing=$(git ls-remote --heads origin "$branch" | cut -f1)
            if [[ "$existing" != "$candidate" ]]; then
              echo "Integration branch already exists with different work; refusing to replace it." >&2
              exit 1
            fi
          else
            git push origin "$candidate:refs/heads/$branch"
          fi
          {
            echo "Upstream: fahadalijaved/OneOS@$upstream"
            echo "Debug base: $base"
            echo ""
            echo "Clean candidates may be promoted to debug only after isolated full CI and patch verification. Release remains manual."
            echo "Keep fork-only device support, signed patch updates, guarded root/staging code and fork-owned payload sources."
            echo "Any new pinned payloads must pass the migration and APK build on debug."
            if [[ -n "$reason" ]]; then
              echo ""
              echo "$reason"
              printf '\n~~~text\n%s\n~~~\n' "$conflicts"
            fi
          } > "$RUNNER_TEMP/upstream-pr.md"
          url=$(gh pr create --base debug --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/upstream-pr.md" "${draft[@]}")
          number=${url##*/}
          echo "pr=$number" >> "$GITHUB_OUTPUT"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$reason" ]]; then
            echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: prepare
    if: needs.prepare.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check integration scope without executing candidate code
        id: check
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANDIDATE"
          [[ "$(git rev-parse HEAD)" == "$BASE" ]]
          [[ "$(git rev-parse "$CANDIDATE^1")" == "$BASE" ]]
          # Protect the automation, signing/build chain, security checks and test
          # gates from automatic changes. The owner can review those manually.
          python3 - <<'PYTHON'
          import os, re, subprocess
          base, candidate = os.environ["BASE"], os.environ["CANDIDATE"]
          paths = subprocess.check_output(["git", "diff", "--name-only", "-z", base, candidate]).decode().split("\0")
          protected = []
          for p in filter(None, paths):
              if (p.startswith((".github/", "scripts/", "patches/", "switcher/assets/")) and
                  p != "scripts/patch-migration/fork-payloads-v2.json") or re.search(
                      r"(^|/)(gradle/|gradlew(?:\.bat)?$|settings\.gradle(?:\.kts)?$|gradle\.properties$|src/test/|src/androidTest/|src/full/assets/root/)", p):
                  protected.append(p)
              elif p.endswith("build.gradle.kts"):
                  before = subprocess.check_output(["git", "show", f"{base}:{p}"], text=True)
                  after = subprocess.check_output(["git", "show", f"{candidate}:{p}"], text=True)
                  def stripped(s):
                      return re.sub(r'(?m)^\s*version(?:Code|Name)\s*=.*$', '', s)
                  if stripped(before) != stripped(after):
                      protected.append(p)
          # No downgrade or reused Android versionCode.
          for p in ("app-android/app/build.gradle.kts", "app-android/guest/build.gradle.kts"):
              old = subprocess.check_output(["git", "show", f"{base}:{p}"], text=True)
              new = subprocess.check_output(["git", "show", f"{candidate}:{p}"], text=True)
              a = re.search(r'(?m)^\s*versionCode\s*=\s*(\d+)\s*$', old)
              b = re.search(r'(?m)^\s*versionCode\s*=\s*(\d+)\s*$', new)
              if not a or not b or int(b[1]) <= int(a[1]):
                  protected.append(p + " (versionCode must increase)")
          if protected:
              print("Manual review required:", *protected, sep="\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("Protected changes require manual review:\n\n" + "\n".join("- " + p for p in protected) + "\n")
              raise SystemExit(1)
          PYTHON
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  migrate-candidate:
    needs: [prepare, gate]
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: fork-patch-payload-migration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Copy only candidate pin metadata into trusted checkout
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANDIDATE"
          [[ "$(git rev-parse HEAD)" == "$BASE" ]]
          [[ "$(git rev-parse "$CANDIDATE^1")" == "$BASE" ]]
          python3 - <<'PYTHON'
          import os, re, subprocess
          from pathlib import Path
          candidate = os.environ["CANDIDATE"]
          directory = Path("app-android/packages")
          allowed = re.compile(r"app-android/packages/[a-z0-9-]+\.sha256")
          special = {"app-android/packages/remote.txt", "app-android/packages/sizes.txt",
                     "scripts/patch-migration/fork-payloads-v2.json"}
          entries = subprocess.check_output(["git", "ls-tree", "-r", "-z", candidate, "--",
                     str(directory), "scripts/patch-migration/fork-payloads-v2.json"]).decode().split("\0")
          copied = set()
          for entry in filter(None, entries):
              info, path = entry.split("\t", 1)
              if path not in special and not allowed.fullmatch(path):
                  continue
              mode, kind, sha = info.split()
              if mode != "100644" or kind != "blob":
                  raise RuntimeError(f"Unexpected metadata mode: {path}")
              Path(path).write_bytes(subprocess.check_output(["git", "cat-file", "blob", sha]))
              copied.add(path)
          if not special <= copied:
              raise RuntimeError("Incomplete candidate metadata")
          for path in directory.glob("*.sha256"):
              if str(path) not in copied:
                  path.unlink()
          PYTHON
      - name: Verify and publish missing immutable payloads with trusted migration code
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          # Never run scripts from the candidate with a write token.
          python3 - <<'PYTHON'
          import importlib.util, os
          from pathlib import Path
          script = Path("scripts/migrate-all-patch-payloads.py")
          spec = importlib.util.spec_from_file_location("migration", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.run(publish=True, target=os.environ["BASE"])
          PYTHON

  preflight:
    needs: [prepare, gate, migrate-candidate]
    if: needs.gate.outputs.eligible == 'true' && needs.migrate-candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all patch assets exist in the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/migrate-all-patch-payloads.py --check-catalog
          python3 scripts/migrate-all-patch-payloads.py --verify
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          set -eu
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:?no Android SDK on the runner}}
          sdkmanager=$sdk/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi
          [ -x "$sdkmanager" ] || { echo "no sdkmanager under $sdk/cmdline-tools" >&2; exit 1; }
          echo "Using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Build guest manager (ephemeral debug signing key)
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: sh scripts/build-guest-manager.sh debug

      - name: Verify optional guest partition image safety
        run: |
          python3 scripts/test-guest-refresh-rate.py
          python3 scripts/test-guest-partitions.py
          python3 scripts/test-guest-vendor.py
          python3 scripts/test-stock-vendor.py
          python3 scripts/test-stock-odm.py
          python3 scripts/test-stock-parts-setup.py
          sh -n switcher/assets/guest_partitions.sh
          sh -n scripts/inspect-guest-vendor.sh

      - name: Verify update handling
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-guest-manager-update.py
          python3 scripts/test-patch-channel.py
          python3 scripts/test-patch-migration.py
          python3 scripts/migrate-patch-payloads.py --check-inventory
          cd app-android
          ./gradlew --console=plain :core:model:test --tests '*AppUpdateTest' --tests '*ProfilesTest' --tests '*GatesTest' --tests '*GitHubIssueReportTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest \
            --tests '*StageScriptTest.patchAutoLaunchArgumentReachesRootChecks' \
            --tests '*StageScriptTest.launchBatteryLimitsComeFromTheArguments' \
            --tests '*StageScriptTest.a55VulkanUsesTheColorOsStage'

      - name: Verify HyperOS Popsicle image and staging
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-popsicle-framework-dex.py
          python3 scripts/test-popsicle-guards.py
          python3 scripts/test-popsicle-native.py
          python3 scripts/test-popsicle-publisher.py
          cd app-android
          ./gradlew --console=plain :core:model:test \
            --tests '*ApkSeriesTest' --tests '*ImagesTest' --tests '*PackageSetsTest.popsicleStagingSetMatchesItsPayloadAndGuardPins' \
            --tests '*SingleImageZipInputStreamTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest \
            --tests '*StageScriptTest.popsicleStagesAndPassesLaunchChecksOnTheBaseGalaxyS23'

      - name: Verify ColorOS Twinity image and staging
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-twinity-image.py
          python3 scripts/test-twinity-services-dex.py
          python3 scripts/test-twinity-surfaceflinger.py
          python3 scripts/test-twinity-package.py
          python3 scripts/test-twinity-publisher.py
          cd app-android
          ./gradlew --console=plain :core:model:test \
            --tests '*ApkSeriesTest' --tests '*ImagesTest' --tests '*PackageSetsTest.twinityStagingSetMatchesItsPayloadAndGuardPins' \
            --tests '*ProfilesTest.twinityIsOfferedOnTheBaseGalaxyS23AndS26Fe' --tests '*SingleImageZipInputStreamTest' \
            --tests '*DeviceListTest' --tests '*ImageGuideTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest \
            --tests '*StageScriptTest.twinityStagesAndPassesLaunchChecksOnTheBaseGalaxyS23' \
            --tests '*StageScriptTest.galaxyS26FeStagesAndroid17ImagesOnly'

      - name: Verify signed guest startup patch lifecycle
        run: |
          classes=$(mktemp -d)
          javac -d "$classes" app-android/patch-protocol/src/main/java/com/fahadali/oneos/patch/*.java \
            scripts/GuestStartPatchTest.java scripts/PatchDownloadTest.java scripts/PatchTrialTest.java scripts/SignGuestStartPatch.java
          java -cp "$classes" GuestStartPatchTest
          java -cp "$classes" com.fahadali.oneos.patch.PatchDownloadTest
          java -cp "$classes" PatchTrialTest
          python3 scripts/test-guest-patch-handoff.py

      - name: Verify restart Home acknowledgement
        run: |
          sh -n switcher/assets/oneos_switch.sh
          sh -n switcher/assets/guest_prepare.sh
          sh -n switcher/assets/guest_patch.sh
          python3 scripts/test-restart-home.py

      - name: Verify guest media mount safety
        run: python3 scripts/test-guest-media-share.py

      - name: Verify guest telemetry policy
        run: |
          python3 scripts/test-oplus-telemetry.py
          python3 scripts/test-guest-telemetry.py
          python3 scripts/test-miui-telemetry.py

      - name: Verify the kernel-tool preflight scanner
        run: python3 scripts/test-libtimer-preflight-scan.py

      - name: Verify guest audio, Bluetooth, and camera policy
        run: |
          python3 scripts/test-guest-audio-policy.py
          python3 scripts/test-oplus-bt-origin.py
          python3 scripts/test-samsung-camera-bind.py

      - name: Verify model and root staging after upstream sync
        working-directory: app-android
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --console=plain :core:model:test --tests '*CompatEvaluatorTest' --tests '*GatesTest' --tests '*PackageSetsTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest --tests '*StageAuditTest' --tests '*StageScriptTest.launchArgumentsReachRootChecks' --tests '*StageScriptTest.bring*'

      # No -Poneos.series / -Poneos.packSets: the APK carries the session
      # scripts and each set's lists only, so no out/ set directories are needed.
      # assembleFullDebug also runs checkFullDebugStagingApk (python3, preinstalled).
      - name: Build app
        working-directory: app-android
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: ./gradlew --console=plain :app:assembleFullDebug

      - name: Additional complete model and root test suites
        working-directory: app-android
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: ./gradlew --console=plain :core:model:test :core:root:testDebugUnitTest

  promote:
    needs: [prepare, gate, preflight]
    if: needs.gate.outputs.eligible == 'true' && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Promote the exact tested commit to debug
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: DeathThoughts/OneOS-test
          PR: ${{ needs.prepare.outputs.pr }}
          BASE: ${{ needs.prepare.outputs.base }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ && "$BASE" =~ ^[0-9a-f]{40}$ && "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GH_REPO/git/ref/heads/debug" --jq .object.sha)
          [[ "$current" == "$BASE" ]] || { echo "Debug advanced; a fresh integration is required."; exit 1; }
          pr=$(gh api "repos/$GH_REPO/pulls/$PR")
          jq -e --arg base "$BASE" --arg head "$CANDIDATE" --arg repo "$GH_REPO" \
            '.state=="open" and .draft==false and .base.ref=="debug" and .base.sha==$base and .head.sha==$head and .head.repo.full_name==$repo and (.head.ref | startswith("sync/upstream-"))' <<< "$pr" >/dev/null
          # GitHub verifies that this is a fast-forward update. No force push,
          # and no second untested merge commit. Debug protection still applies.
          gh api --method PATCH "repos/$GH_REPO/git/refs/heads/debug" -f sha="$CANDIDATE" -F force=false >/dev/null
          [[ "$(gh api "repos/$GH_REPO/git/ref/heads/debug" --jq .object.sha)" == "$CANDIDATE" ]]
          # Pushes from GITHUB_TOKEN do not trigger normal workflows.
          gh workflow run build-apk.yml --ref debug
          gh pr comment "$PR" --body "Automatically integrated exact tested commit $CANDIDATE into debug. Signed debug build dispatched. Release remains manual." || true
          echo "Promoted $CANDIDATE to debug; signed build dispatched." >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [prepare, gate, migrate-candidate, preflight, promote]
    if: always() && needs.prepare.outputs.candidate != '' && needs.prepare.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Report the isolated preflight result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: DeathThoughts/OneOS-test
          PR: ${{ needs.prepare.outputs.pr }}
          RESULT: ${{ needs.preflight.result }}
          GATE: ${{ needs.gate.result }}
          MIGRATION: ${{ needs.migrate-candidate.result }}
          PROMOTE: ${{ needs.promote.result }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          gh pr comment "$PR" --body "Automated checks for $CANDIDATE: scope **$GATE**, patch migration **$MIGRATION**, tests/build **$RESULT**, debug promotion **$PROMOTE**. Physical device validation and stable release remain manual. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
