name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both APKs to GitHub Releases
        type: boolean
        default: false
  pull_request:
    branches: [debug]
    paths:
      - "app-android/**"
      - "switcher/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"
  push:
    branches: [release, debug]
    paths:
      - "app-android/**"
      - "switcher/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  migrate-patch-payloads:
    if: github.repository == 'DeathThoughts/OneOS-test' && github.ref_name == 'debug' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    concurrency:
      group: fork-patch-payload-migration
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Migrate all active pinned patch payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/migrate-all-patch-payloads.py --publish --target "$GITHUB_SHA"

  build:
    needs: migrate-patch-payloads
    if: >-
      !cancelled() && (needs.migrate-patch-payloads.result == 'success' || needs.migrate-patch-payloads.result == 'skipped') &&
      (github.ref_name == 'release' || github.ref_name == 'debug' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.ref_name == 'release' && '["debug","release"]' || '["debug"]') }}
    environment: ${{ matrix.variant == 'release' && 'release-signing' || 'debug-build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The build reads no git metadata (versionName/versionCode are literals in
      # app/build.gradle.kts), so a shallow clone is enough.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ matrix.variant == 'debug' && github.ref_name == 'release' && 'debug' || github.sha }}
          persist-credentials: false

      - name: Verify every active fork patch source before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/migrate-all-patch-payloads.py --check-catalog
          python3 scripts/migrate-all-patch-payloads.py --verify

      - name: Check debug branch is based on this release
        if: matrix.variant == 'debug' && github.ref_name == 'release'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: git merge-base --is-ancestor "$RELEASE_SHA" HEAD

      # jvmToolchain = "21" (gradle/libs.versions.toml) and gradle.properties
      # forbids toolchain auto-download, so JDK 21 must be on the runner.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already carries an Android SDK (ANDROID_HOME) with
      # cmdline-tools. android-actions/setup-android@v3 is not used: it always
      # runs `sdkmanager tools`, which the runner's cmdline-tools 16.0 no
      # longer knows ("Failed to find package 'tools'", run 43715769344).
      # compileSdk 37, and the build-tools AGP 9.4.1 defaults to.
      - name: Install Android SDK packages
        run: |
          set -eu
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:?no Android SDK on the runner}}
          sdkmanager=$sdk/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi
          [ -x "$sdkmanager" ] || { echo "no sdkmanager under $sdk/cmdline-tools" >&2; exit 1; }
          echo "Using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      # Each runner makes a fresh ~/.android/debug.keystore, so every run's APK
      # had a different signer and could not be installed over the previous
      # build. With the repository secret DEBUG_KEYSTORE_B64 (base64 of a debug
      # keystore: store/key password `android`, alias `androiddebugkey`) every
      # run signs with that key. Writing it to ~/.android/debug.keystore alone
      # was not enough: run 43736112838 decoded the right key there and AGP
      # still signed with another one. So the key also goes to a fixed path,
      # exported as ONEOS_DEBUG_KEYSTORE, which app/ and guest/build.gradle.kts
      # set as the debug signing config's storeFile.
      - name: Install release keystore
        if: matrix.variant == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          : "${KEYSTORE_B64:?Missing RELEASE_KEYSTORE_B64}"
          : "${STORE_PASSWORD:?Missing RELEASE_STORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing RELEASE_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD}"
          umask 077
          export SIGNING_DIR="$HOME/.oneos-release"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$SIGNING_DIR/oneos-release.jks"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          def escape(value):
              return ''.join(f'\\u{unit:04x}' for unit in (
                  int.from_bytes(pair, 'big') for pair in chunks(value.encode('utf-16-be'))
              ))

          def chunks(data):
              return (data[i:i + 2] for i in range(0, len(data), 2))

          directory = Path(os.environ['SIGNING_DIR'])
          properties = {
              'storeFile': str(directory / 'oneos-release.jks'),
              'storePassword': os.environ['STORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          (directory / 'keystore.properties').write_text(
              ''.join(f'{key}={escape(value)}\n' for key, value in properties.items()),
              encoding='ascii',
          )
          PYTHON

      - name: Install debug keystore
        if: matrix.variant == 'debug'
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -eu
          if [ -z "${DEBUG_KEYSTORE_B64:-}" ]; then
            msg="DEBUG_KEYSTORE_B64 not set: this APK is signed with a one-off key and cannot be installed over an earlier build"
            echo "::warning::$msg"
            echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ks=$RUNNER_TEMP/oneos-debug.keystore
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$ks"
          chmod 600 "$ks"
          mkdir -p "$HOME/.android"
          cp "$ks" "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          fp=$(keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey | grep 'SHA256:' | head -n 1 | sed 's/^[[:space:]]*SHA256:[[:space:]]*//')
          [ -n "$fp" ] || { echo "no SHA256 fingerprint for androiddebugkey in $ks" >&2; exit 1; }
          echo "Debug keystore: SHA256: $fp"
          echo "Debug keystore certificate: \`$fp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "ONEOS_DEBUG_KEYSTORE=$ks" >> "$GITHUB_ENV"
          # Lowercase hex without colons, as apksigner prints it; checked against
          # the APK's signer after the build.
          echo "ONEOS_DEBUG_KEYSTORE_SHA256=$(printf '%s' "$fp" | tr -d ':' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5

      - name: Configure debug patch pin and sign a marker
        id: debug-patch
        if: matrix.variant == 'debug'
        env:
          ONEOS_PATCH_DEBUG_PRIVATE_KEY_B64: ${{ secrets.ONEOS_PATCH_DEBUG_PRIVATE_KEY_B64 }}
          ONEOS_PATCH_DEBUG_PUBLIC_KEY: ${{ vars.ONEOS_PATCH_DEBUG_PUBLIC_KEY }}
          ONEOS_PATCH_RELEASE_PUBLIC_KEY: ${{ vars.ONEOS_PATCH_RELEASE_PUBLIC_KEY }}
          ONEOS_PATCH_SMOKE_IMAGE: ${{ vars.ONEOS_PATCH_SMOKE_IMAGE }}
          ONEOS_PATCH_SMOKE_SEQUENCE: ${{ vars.ONEOS_PATCH_SMOKE_SEQUENCE }}
        run: |
          set -eu
          if [ -n "${ONEOS_PATCH_DEBUG_PRIVATE_KEY_B64:-}" ]; then
            sh scripts/sign-debug-patch-smoke.sh "$RUNNER_TEMP/oneos-debug-patch"
            ONEOS_PATCH_DEBUG_PUBLIC_KEY=$(cat "$RUNNER_TEMP/oneos-debug-patch/public-key.b64")
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${ONEOS_PATCH_DEBUG_PUBLIC_KEY:-}" ]; then
            # BuildConfig only accepts this DER public-key encoding. Do not let
            # an unexpected newline in a repository variable write extra settings.
            printf '%s' "$ONEOS_PATCH_DEBUG_PUBLIC_KEY" | grep -qE '^[A-Za-z0-9+/]{59}=$'
            [ "${#ONEOS_PATCH_DEBUG_PUBLIC_KEY}" = 60 ]
            printf 'ONEOS_PATCH_DEBUG_PUBLIC_KEY=%s\n' "$ONEOS_PATCH_DEBUG_PUBLIC_KEY" >> "$GITHUB_ENV"
          else
            echo "Signed patch feed disabled in this build: no debug patch key." >> "$GITHUB_STEP_SUMMARY"
          fi

      # :app refuses to run its staging task without the git-ignored
      # switcher/assets/guest_manager.apk, so stage it first.
      - name: Build guest manager
        env:
          ONEOS_PATCH_RELEASE_PUBLIC_KEY: ${{ vars.ONEOS_PATCH_RELEASE_PUBLIC_KEY }}
          # settings.gradle.kts reads these when ~/.config/twidget/github.properties
          # is absent. The workflow token with packages:read should read
          # tribalfs' public packages; if maven.pkg.github.com refuses it, add a
          # repository secret GH_PACKAGES_TOKEN (classic PAT with read:packages)
          # and, if its owner is not the actor, a variable GH_PACKAGES_USER.
          GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: sh scripts/build-guest-manager.sh ${{ matrix.variant }}

      - name: Verify update handling
        env:
          GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/test-guest-manager-update.py
          python3 scripts/test-patch-channel.py
          python3 scripts/test-patch-migration.py
          python3 scripts/migrate-patch-payloads.py --check-inventory
          cd app-android
          ./gradlew --console=plain :core:model:test --tests '*AppUpdateTest' --tests '*ProfilesTest' --tests '*GatesTest' --tests '*GitHubIssueReportTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest \
            --tests '*StageScriptTest.patchAutoLaunchArgumentReachesRootChecks' \
            --tests '*StageScriptTest.launchBatteryLimitsComeFromTheArguments' \
            --tests '*StageScriptTest.a55VulkanUsesTheColorOsStage'

      - name: Verify HyperOS Popsicle image and staging
        env:
          GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/test-popsicle-framework-dex.py
          python3 scripts/test-popsicle-guards.py
          python3 scripts/test-popsicle-native.py
          python3 scripts/test-popsicle-publisher.py
          cd app-android
          ./gradlew --console=plain :core:model:test \
            --tests '*ApkSeriesTest' --tests '*ImagesTest' --tests '*PackageSetsTest.popsicleStagingSetMatchesItsPayloadAndGuardPins' \
            --tests '*SingleImageZipInputStreamTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest \
            --tests '*StageScriptTest.popsicleStagesAndPassesLaunchChecksOnTheBaseGalaxyS23'

      - name: Verify ColorOS Twinity image and staging
        env:
          GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/test-twinity-image.py
          python3 scripts/test-twinity-services-dex.py
          python3 scripts/test-twinity-surfaceflinger.py
          python3 scripts/test-twinity-package.py
          python3 scripts/test-twinity-publisher.py
          cd app-android
          ./gradlew --console=plain :core:model:test \
            --tests '*ApkSeriesTest' --tests '*ImagesTest' --tests '*PackageSetsTest.twinityStagingSetMatchesItsPayloadAndGuardPins' \
            --tests '*ProfilesTest.twinityIsOfferedOnTheBaseGalaxyS23AndS26Fe' --tests '*SingleImageZipInputStreamTest' \
            --tests '*DeviceListTest' --tests '*ImageGuideTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest \
            --tests '*StageScriptTest.twinityStagesAndPassesLaunchChecksOnTheBaseGalaxyS23' \
            --tests '*StageScriptTest.galaxyS26FeStagesAndroid17ImagesOnly'

      - name: Verify signed guest startup patch lifecycle
        run: |
          classes=$(mktemp -d)
          javac -d "$classes" app-android/patch-protocol/src/main/java/com/fahadali/oneos/patch/*.java \
            scripts/GuestStartPatchTest.java scripts/PatchDownloadTest.java scripts/PatchTrialTest.java scripts/SignGuestStartPatch.java
          java -cp "$classes" GuestStartPatchTest
          java -cp "$classes" com.fahadali.oneos.patch.PatchDownloadTest
          java -cp "$classes" PatchTrialTest
          python3 scripts/test-guest-patch-handoff.py

      - name: Verify restart Home acknowledgement
        run: |
          sh -n switcher/assets/oneos_switch.sh
          sh -n switcher/assets/guest_prepare.sh
          sh -n switcher/assets/guest_patch.sh
          python3 scripts/test-restart-home.py

      - name: Verify guest media mount safety
        run: python3 scripts/test-guest-media-share.py

      - name: Verify guest telemetry policy
        run: |
          python3 scripts/test-oplus-telemetry.py
          python3 scripts/test-guest-telemetry.py
          python3 scripts/test-miui-telemetry.py

      - name: Verify the kernel-tool preflight scanner
        run: python3 scripts/test-libtimer-preflight-scan.py

      - name: Verify guest audio, Bluetooth, and camera policy
        run: |
          python3 scripts/test-guest-audio-policy.py
          python3 scripts/test-oplus-bt-origin.py
          python3 scripts/test-samsung-camera-bind.py

      - name: Verify model and root staging after upstream sync
        working-directory: app-android
        env:
          GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --console=plain :core:model:test --tests '*CompatEvaluatorTest' --tests '*GatesTest' --tests '*PackageSetsTest'
          ./gradlew --console=plain :core:root:testDebugUnitTest --tests '*StageAuditTest' --tests '*StageScriptTest.launchArgumentsReachRootChecks' --tests '*StageScriptTest.bring*'

      # No -Poneos.series / -Poneos.packSets: the APK carries the session
      # scripts and each set's lists only, so no out/ set directories are needed.
      # assembleFullDebug also runs checkFullDebugStagingApk (python3, preinstalled).
      - name: Build app
        working-directory: app-android
        env:
          GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew --console=plain :app:assembleFull${{ matrix.variant == 'release' && 'Release' || 'Debug' }}

      - name: Verify signature and prepare download
        id: apk
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          built="app-android/app/build/outputs/apk/full/$VARIANT/app-full-$VARIANT.apk"
          mkdir -p dist
          name="OneOS-$VARIANT.apk"
          apk="dist/$name"
          cp "$built" "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "$sha  $name" > "$apk.sha256"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | head -n 1)
          vname=$(printf '%s\n' "$badging" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          vcode=$(printf '%s\n' "$badging" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          signer=$(printf '%s\n' "$certs" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          [ -n "$signer" ] || { echo "::error::APK signature could not be verified"; exit 1; }
          {
            echo "### OneOS $VARIANT APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`$vname\` |"
            echo "| versionCode | \`$vcode\` |"
            echo "| file | \`$name\` |"
            echo "| sha256 | \`$sha\` |"
            # Same value on every run when DEBUG_KEYSTORE_B64 is set; compare it
            # with the installed build's signer before updating over it.
            if [ -n "$signer" ]; then
              echo "| signer SHA-256 | \`$signer\` |"
            fi
            if [ -n "${ONEOS_DEBUG_KEYSTORE_SHA256:-}" ]; then
              echo "| keystore SHA-256 | \`$ONEOS_DEBUG_KEYSTORE_SHA256\` |"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # With the secret set, an APK signed by any other key is the bug this
          # check exists for (run 43736112838): fail instead of uploading it.
          if [ -n "${ONEOS_DEBUG_KEYSTORE_SHA256:-}" ] && [ "$signer" != "$ONEOS_DEBUG_KEYSTORE_SHA256" ]; then
            echo "::error::$name is signed by ${signer:-<no signer>}, not the DEBUG_KEYSTORE_B64 key $ONEOS_DEBUG_KEYSTORE_SHA256"
            exit 1
          fi
          guest="OneOSGuest-$VARIANT.apk"
          cp "app-android/guest/build/outputs/apk/$VARIANT/guest-$VARIANT.apk" "dist/$guest"
          guest_certs=$("$apksigner" verify --print-certs "dist/$guest")
          guest_signer=$(printf '%s\n' "$guest_certs" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          [ -n "$guest_signer" ] && [ "$guest_signer" = "$signer" ] ||
            { echo "::error::$guest signer differs from the host APK signer"; exit 1; }
          (cd dist && sha256sum "$guest" > "$guest.sha256")
          # A one-off debug key is useful for CI artifacts only. Withhold the
          # manifests so the publishing jobs cannot promote those APKs.
          if [ "$VARIANT" = release ] || [ -n "${ONEOS_DEBUG_KEYSTORE_SHA256:-}" ]; then
            python3 scripts/write-update-manifests.py --variant "$VARIANT" --run-id "${{ github.run_id }}"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: oneos-${{ matrix.variant }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/*update-*.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: steps.debug-patch.outputs.ready == 'true'
        with:
          name: oneos-debug-signed-patch
          path: ${{ runner.temp }}/oneos-debug-patch/guest-start.patch
          if-no-files-found: error


  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'release' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: oneos-*
          merge-multiple: true
          path: dist
      - name: Publish both APKs on one release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
        run: |
          set -eu
          tag="oneos-build-$BUILD_ID"
          for variant in debug release; do
            if [ ! -s "dist/update-$variant.json" ] || [ ! -s "dist/guest-update-$variant.json" ]; then
              echo "::error::Missing verified $variant update metadata. Check the APK signing secrets."
              exit 1
            fi
            (cd dist && sha256sum -c "OneOS-$variant.apk.sha256" && sha256sum -c "OneOSGuest-$variant.apk.sha256")
          done
          gh release create "$tag" --target "$RELEASE_SHA" --title "OneOS build $BUILD_ID" \
            --notes 'Release is for normal use (30% battery or charging, below 42 °C). Debug is for testing (5% battery or charging, below 50 °C).' \
            dist/*.apk dist/*.sha256 dist/*update-*.json

  publish-debug-updates:
    if: github.ref_name == 'debug'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: oneos-debug
          path: dist
      - name: Publish signed debug updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ github.run_id }}
          DEBUG_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ ! -s dist/update-debug.json ] || [ ! -s dist/guest-update-debug.json ]; then
            echo "::notice::Debug APKs are available as workflow artifacts. Configure DEBUG_KEYSTORE_B64 to publish updates."
            exit 0
          fi
          (cd dist && sha256sum -c OneOS-debug.apk.sha256 && sha256sum -c OneOSGuest-debug.apk.sha256)
          tag="oneos-build-$BUILD_ID"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$DEBUG_SHA" --prerelease --title "OneOS debug build $BUILD_ID" \
              --notes 'Debug test build. Includes the signed guest app for updates from inside a guest.'
          fi
          gh release upload "$tag" dist/*.apk dist/*.sha256 dist/*update-*.json --clobber
          if ! gh release view oneos-debug >/dev/null 2>&1; then
            gh release create oneos-debug --target "$DEBUG_SHA" --prerelease --title 'OneOS debug update channel' \
              --notes 'Update metadata for the newest completed debug build. APK links point to its build release.'
          fi
          gh release upload oneos-debug dist/update-debug.json dist/guest-update-debug.json --clobber
