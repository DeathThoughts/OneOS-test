name: Build HyperOS Madrid image

on:
  workflow_dispatch:
  push:
    branches: [test/hyperos-madrid]

permissions:
  contents: read

concurrency:
  group: madrid-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'DeathThoughts/OneOS-test' && github.ref == 'refs/heads/test/hyperos-madrid'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: MysticGSI/mysticgsi
          ref: 825b850dd8ddff11fdb8ed024034fc00e94b1451
          path: mysticgsi
          persist-credentials: false
          sparse-checkout: |
            /*.py
            /requirements.txt
            /patches/
            /tools/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install image and overlay tools
        run: |
          set -euo pipefail
          mkdir -p out/madrid-logs
          {
            sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:?no Android SDK on the runner}}
            sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/lib/swift "${sdk:?}/ndk"
            sudo apt-get update
            sudo apt-get install -y e2fsprogs zip unzip zstd python3-venv
            sdkmanager=$sdk/cmdline-tools/latest/bin/sdkmanager
            if [ ! -x "$sdkmanager" ]; then
              sdkmanager=$(ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
            fi
            [ -x "$sdkmanager" ] || { echo "no sdkmanager under $sdk/cmdline-tools" >&2; exit 1; }
            yes | "$sdkmanager" --licenses > /dev/null || true
            "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"
            echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
            python3 -m venv mysticgsi/.venv
            mysticgsi/.venv/bin/python -m pip install -r mysticgsi/requirements.txt capstone
            chmod +x mysticgsi/tools/bin/Linux/x86_64/{e2fsdroid,extract.erofs,mke2fs,mkfs.erofs}
            df -h "$GITHUB_WORKSPACE"
          } 2>&1 | tee out/madrid-logs/setup.log

      - name: Build and verify Madrid image
        run: |
          set -euo pipefail
          python3 scripts/build-madrid-image.py 2>&1 | tee out/madrid-logs/image.log
          df -h "$GITHUB_WORKSPACE" | tee -a out/madrid-logs/image.log

      - uses: actions/upload-artifact@v4
        with:
          name: madrid-system
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            out/madrid-image/result/OneOS_HyperOS4_Madrid.zip
            out/madrid-image/result/inventory.json

      - name: Build Madrid overlays
        id: overlays
        env:
          APKTOOL: ${{ github.workspace }}/mysticgsi/tools/apktool/apktool.jar
          EXTRACT_EROFS: ${{ github.workspace }}/mysticgsi/tools/bin/Linux/x86_64/extract.erofs
        run: |
          set -euo pipefail
          key_dir=$(mktemp -d "$RUNNER_TEMP/madrid-rro.XXXXXX")
          trap 'rm -rf "$key_dir"' EXIT
          export KEYSTORE="$key_dir/debug.keystore"
          {
            keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=OneOS Madrid RRO Debug,O=OneOS,C=US"
            sh scripts/make-overlays.sh out/madrid-image/result/system.img out/madrid-overlays --madrid
            cd out/madrid-overlays
            sha256sum --strict --check guards.txt
            find . -type f -print0 | sort -z | xargs -0r sha256sum > ../madrid-overlays.sha256
            test -s ../madrid-overlays.sha256
            mv ../madrid-overlays.sha256 SHA256SUMS
          } 2>&1 | tee out/madrid-logs/overlays.log

      - uses: actions/upload-artifact@v4
        if: always() && steps.overlays.outcome == 'success'
        with:
          name: madrid-overlays
          retention-days: 14
          if-no-files-found: error
          path: out/madrid-overlays/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madrid-build-report
          retention-days: 14
          if-no-files-found: warn
          path: out/madrid-logs/
